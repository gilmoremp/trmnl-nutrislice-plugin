<div class="layout layout--top pt--1 px--5 pb--5">
  <div class="grid grid--cols-5 gap--10">
    {% for day in days %}
      <div class="text--center">
          <div class="font--bold text--xl lg:title--large" style="line-height: 1;">{{ day.date | date: "%A" | upcase }}</div>
          <div class="label--underline mb--0 text--lg lg:title--base" style="line-height: 1;">{{ day.date | date: "%m/%d" }}</div>

          <div class="text--sm label--underline mt--3" style="line-height: 1;">Breakfast</div>
          <div class="title title--small lg:title--base font--bold" style="line-height: 1.1;">{{ day.breakfast_main }}</div>

          <div class="text--sm label--underline mt--3" style="line-height: 1;">Lunch</div>
          <div class="title title--small lg:title--base font--bold" style="line-height: 1.1;">{{ day.lunch_main }}</div>
      </div>
    {% endfor %}
  </div>
</div><div class="title_bar">
  <span class="title">{{ school_name }}</span>
  <span class="instance">Breakfast & Lunch</span>
</div>
