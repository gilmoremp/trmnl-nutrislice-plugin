<div class="layout layout--col layout--top pt--2 px--3 pb--3">
  <table class="table table--condensed w--full">
    <tbody>
      {% for day in days %}
        <tr>
          <td class="w--25 text--left py--2 pr--2">
            <div class="font--bold text--sm" style="line-height: 1;">{{ day.date | date: "%a" | upcase }}</div>
            <div class="text--xs" style="line-height: 1;">{{ day.date | date: "%m/%d" }}</div>
          </td>
          <td class="py--2">
            <div class="text--xs label--underline" style="line-height: 1;">Breakfast</div>
            <div class="text--sm font--bold clamp--1" style="line-height: 1.1;">{{ day.breakfast_main }}</div>
            <div class="text--xs label--underline mt--1" style="line-height: 1;">Lunch</div>
            <div class="text--sm font--bold clamp--1" style="line-height: 1.1;">{{ day.lunch_main }}</div>
          </td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
</div>

<div class="title_bar">
  <span class="title">{{ school_name }}</span>
  <span class="instance">Breakfast & Lunch</span>
</div>
