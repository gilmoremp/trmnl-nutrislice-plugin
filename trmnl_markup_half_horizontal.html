<div class="layout layout--top pt--1 px--5 pb--3">
  <div class="grid grid--cols-5 gap--10">
    {% for day in days %}
      <div class="text--center">
          <div class="font--bold text--lg" style="line-height: 1;">{{ day.date | date: "%a" | upcase }}</div>
          <div class="label--underline mb--1 text--sm" style="line-height: 1;">{{ day.date | date: "%m/%d" }}</div>

          <div class="text--xs label--underline mt--1" style="line-height: 1;">Breakfast</div>
          <div class="text--sm font--bold clamp--2" style="line-height: 1.1;">{{ day.breakfast_main }}</div>

          <div class="text--xs label--underline mt--1" style="line-height: 1;">Lunch</div>
          <div class="text--sm font--bold clamp--2" style="line-height: 1.1;">{{ day.lunch_main }}</div>
      </div>
    {% endfor %}
  </div>
</div><div class="title_bar">
  <span class="title">{{ school_name }}</span>
  <span class="instance">Breakfast & Lunch</span>
</div>
